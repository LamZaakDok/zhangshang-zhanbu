name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成中文字库
        run: |
          pip install pillow
          python tools/gen_font.py

      - name: 安装 PlatformIO
        run: pip install platformio

      - name: 缓存 PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: 编译固件 + 文件系统
        run: |
          pio run
          pio run -t buildfs

      - name: 合成整片烧录镜像(full.bin, 含 bootloader+分区+固件+素材)
        run: |
          BUILD=.pio/build/m5stack-sticks3
          FRAMEWORK=$(ls -d ~/.platformio/packages/framework-arduinoespressif32*)
          ESPTOOL=$(ls ~/.platformio/packages/tool-esptoolpy/esptool.py)
          mkdir -p dist
          # 注意: 不要覆盖 --flash_mode/--flash_size, 继承 bootloader 头部的 DIO/8MB;
          # 若强制写成 qio, ESP32-S3 会因模式不匹配而无法启动。
          python "$ESPTOOL" --chip esp32s3 merge_bin -o dist/zhangshang-zhanbu-full.bin \
            0x0       $BUILD/bootloader.bin \
            0x8000    $BUILD/partitions.bin \
            0xe000    $FRAMEWORK/tools/partitions/boot_app0.bin \
            0x10000   $BUILD/firmware.bin \
            0x310000  $BUILD/spiffs.bin
          cp $BUILD/firmware.bin dist/
          cp $BUILD/spiffs.bin   dist/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
